name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (plain python)
        run: for f in tests/test_*.py; do python3 "$f"; done
      - name: Unit tests (pytest)
        run: |
          python3 -m pip install pytest
          python3 -m pytest -q
      - name: Self-test, every fixture x arm (no agent runs; clones agent-pace at its pinned commit)
        run: python3 -m promisebench.run --self-test --jobs 2
      - name: Analysis reproduces from results/runs.jsonl alone
        run: |
          python3 -m promisebench.analyze --out - | grep -q "claude/sonnet: broken in a commit — prose 16/48"
      - name: Baselines (do-nothing, gold, cheat) behave as the oracles require
        run: python3 -m promisebench.baselines --out /tmp/baselines.json
      - name: README figures match the published data
        run: |
          python3 -m promisebench.figures
          git diff --exit-code docs/figures
